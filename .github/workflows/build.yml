name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the server script parses
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/local-server/StockCountServer.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
      - name: Server smoke test (two PDTs upload at once)
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/server-smoke.ps1
      - run: chmod +x gradlew && ./gradlew assembleDebug
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk stock-count.apk
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # Same APK with the version in the file name, e.g. stock-count-v1.44.apk
          cp stock-count.apk "stock-count-v$APP_VERSION.apk"
          # Server files for the 162 PC, downloadable from the same release
          cp local-server/StockCountServer.ps1 StockCountServer.ps1
          (cd local-server && zip -q ../StockCountServer.zip StockCountServer.ps1 Install.cmd Uninstall.cmd Register-Task.ps1 README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: stock-count-apk
          path: stock-count-v${{ env.APP_VERSION }}.apk
      # Public download that needs no GitHub login:
      # https://github.com/<owner>/<repo>/releases/latest/download/stock-count.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: Stock Count ${{ env.APP_VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: |
            stock-count.apk
            stock-count-v${{ env.APP_VERSION }}.apk
            StockCountServer.ps1
            StockCountServer.zip
          make_latest: true
