name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: if [ -n "$SIGNING_KEYSTORE" ]; then echo "$SIGNING_KEYSTORE" | base64 -d > app/stockcount.jks; fi
      - run: chmod +x gradlew && ./gradlew assembleDebug
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk stock-count.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stock-count-apk
          path: stock-count.apk
      # Public download that needs no GitHub login:
      # https://github.com/<owner>/<repo>/releases/latest/download/stock-count.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stock Count build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: stock-count.apk
          make_latest: true
